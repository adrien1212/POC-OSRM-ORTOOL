# Local / contributor stack: builds the backend and frontend images from source.
# For the deployed stack that pulls pre-built images from GHCR, see
# docker-compose.prod.yml.
#
# Run ./scripts/fetch-osm.sh first — it downloads the OpenStreetMap extract into
# data/. Override OSM_FILE (in .env or the environment) if you fetched a
# different region; see .env.example.

services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    environment:
      OSM_FILE: ${OSM_FILE:-midi-pyrenees-latest.osm.pbf}
    command:
      - sh
      - -lc
      - |
        set -e
        BASE="$${OSM_FILE%.osm.pbf}"
        if [ ! -f "/input/$$OSM_FILE" ]; then
          echo "Missing /input/$$OSM_FILE — run ./scripts/fetch-osm.sh first." >&2
          exit 1
        fi
        cp "/input/$$OSM_FILE" "/data/$$OSM_FILE"
        # .osrm.mldgr is the last file osrm-customize writes — OSRM never creates
        # a bare .osrm, so testing for that would rebuild the graph every start.
        if [ ! -f "/data/$$BASE.osrm.mldgr" ]; then
          osrm-extract -p /opt/car.lua "/data/$$OSM_FILE"
          osrm-partition "/data/$$BASE.osrm"
          osrm-customize "/data/$$BASE.osrm"
        fi
        exec osrm-routed --algorithm mld "/data/$$BASE.osrm"
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD-SHELL", 'test -f "/data/$${OSM_FILE%.osm.pbf}.osrm.mldgr"']
      interval: 10s
      timeout: 5s
      retries: 60
    volumes:
      - ./data:/input:ro
      - osrm_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      OSRM_BASE_URL: http://osrm:5000
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    ports:
      - "8012:8012"
    depends_on:
      osrm:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8013:3000"
    # nginx resolves the backend/osrm upstreams at startup, so both must exist.
    depends_on:
      - backend
      - osrm

volumes:
  osrm_data:
