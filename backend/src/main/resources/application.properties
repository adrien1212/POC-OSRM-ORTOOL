spring.application.name=vrp
server.port=8012

# The OSRM endpoint is read straight from the OSRM_BASE_URL environment variable
# in RouteOptimizationService (default http://127.0.0.1:5001); docker compose
# sets it to http://osrm:5000.

# Origins allowed to call /api/** (comma-separated, '*' wildcards allowed).
# Override with APP_CORS_ALLOWED_ORIGINS when deploying behind a domain.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Actuator: expose only health (usable by the docker compose healthcheck) and info.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
