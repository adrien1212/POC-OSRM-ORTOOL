name: Deploy to VPS

# Requires these repository variables (Settings → Secrets and variables →
# Actions → Variables): VPS_HOST, VPS_USER, APP_DIR.
# And these secrets: DEPLOY_KEY_VPS.

on:
  push:
    tags: ["*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  TAG: ${{ github.ref_name }}        # e.g., v1.2.3

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push ${{ matrix.name }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: frontend
            image: frontend
          - name: backend
            context: backend
            image: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/carto/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: latest=false # don't auto-tag as latest

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            APP_VERSION=${{ env.TAG }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file via SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY_VPS }}
          port: 22
          source: "docker-compose.prod.yml"
          target: ${{ vars.APP_DIR }}

      - name: Deploy using ssh
        uses: appleboy/ssh-action@v1
        env:
          TAG: ${{ env.TAG }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIR: ${{ vars.APP_DIR }}
        with:
          envs: TAG,GHCR_OWNER,GHCR_USER,GHCR_TOKEN,APP_DIR
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY_VPS }}
          port: 22
          script: |
            set -e
            cd "${APP_DIR}"

            printf "%s" "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            export TAG GHCR_OWNER
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker image prune -f
